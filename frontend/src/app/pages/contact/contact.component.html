<section class="l-section">
  <div class="contact-page">
    <header class="contact-page__header">
      <span class="contact-page__subtitle">Mosai Canvas // Direct</span>
      <h1 class="contact-page__title section-title">Contact<br />Us</h1>
    </header>

    <div class="contact-card">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <input type="text" id="name" formControlName="name" placeholder=" " />
          <label for="name">Full Name <span class="required">*</span></label>
        </div>

        <div class="form-group">
          <input type="email" id="email" formControlName="email" placeholder=" " />
          <label for="email">Email <span class="required">*</span></label>
        </div>

        <div class="form-group">
          <input type="text" id="subject" formControlName="subject" placeholder=" " />
          <label for="subject">Subject</label>
        </div>

        <div class="form-group">
          <textarea id="message" formControlName="message" placeholder=" "></textarea>
          <label for="message">Message <span class="required">*</span></label>
        </div>

        <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
      </form>
    </div>
  </div>
</section>
