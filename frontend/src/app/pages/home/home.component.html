<app-mosaicanvas-logo></app-mosaicanvas-logo>

<app-carousel></app-carousel>

<section class="l-section">
  <app-about></app-about>
</section>

<section class="l-section">
  <app-tour></app-tour>
</section>

<!-- Latest Releases Block -->
<section class="l-section">
  <app-latest-releases
    [latestReleases]="latestReleasesList"
    [bandSlug]="homepageBandSlug"
    (action)="onReleaseAction($event)">
  </app-latest-releases>
</section>

<!-- Coming Soon / Pre-Releases Block -->
<section class="l-section">
  <app-pre-releases
    [releases]="preReleasesList"
    [bandSlug]="homepageBandSlug"
    (action)="onReleaseAction($event)">
  </app-pre-releases>
</section>

<section class="l-section">
  <app-ringtones></app-ringtones>
</section>

<section class="l-section">
  <app-mailing-list></app-mailing-list>
</section>

<!-- Get Connected Section -->
<section class="l-section">
  <div class="container">
    <div class="get-connected">
      <div class="get-connected__grid">
        <div class="get-connected__content">
          <h2 class="section-title">Get Connected</h2>
          <p class="get-connected__desc">
            Find us across all major social platforms and streaming services. We
            want to hear from you!
          </p>
        </div>

        <div class="get-connected__card">
          <div class="get-connected__links-group">
            <div class="get-connected__social">
              <app-social-links
                [socialLinks]="socialLinks!"
                variant="glass"
                size="large">
              </app-social-links>
            </div>

            <div class="get-connected__streaming">
              <app-streaming-links
                [streamingLinks]="streamingLinks!"
                variant="glass"
                size="large">
              </app-streaming-links>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
