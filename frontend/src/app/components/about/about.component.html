<section class="l-section" aria-labelledby="about-title">
  <div class="container">
    <div class="about-content">

      <!-- ── Left Column: Text ─────────────────────────────────────── -->
      <div class="about-text-wrapper">

        <!-- BAND PAGE -->
        <ng-container *ngIf="band; else homeAbout">

          <!-- Band About title -->
          <h2 id="about-title" class="section-title">
            About
          </h2>
          
          <!-- Band About bio -->
          <p class="about-body">
            {{ band.bio }}
          </p>

        </ng-container>

        <!-- HOME PAGE -->
        <ng-template #homeAbout>

          <div *ngIf="loading" class="loading">
            Loading...
          </div>

          <div *ngFor="let about of aboutList; let i = index">

            <!-- About title -->
            <h2 id="about-title" class="section-title">
              {{ about.title }}
            </h2>

            <!-- About body -->
            <p class="about-body">
              {{ about.body }}
            </p>

          </div>

        </ng-template>
      </div>

      <!-- ── Right Column: Player / Watermark ─────────────────────── -->

      <!-- BAND PAGE: Spotify player -->
      <div
        *ngIf="showStreamingPlayer"
        class="about-visual-accent about-player"
        aria-label="Music player"
      >
        <app-streaming-players
          [streamingPlayer]="streamingPlayer"
        ></app-streaming-players>
      </div>

      <!-- HOME PAGE / No player: watermark -->
      <div
        *ngIf="showWatermark"
        class="about-visual-accent"
        aria-hidden="true"
      >
        <!-- <span #parallaxText class="vertical-brand">
          {{ band ? band.name : 'MOSAI CANVAS' }}
        </span> -->
         <!-- Rectangle Icon (Positioned behind text, animates in first) -->
        <img
          src="https://res.cloudinary.com/des66zgsp/image/upload/v1793236020/mosai-canvas-logo-rectangle-cropped_uia1fp.png"
          alt="Mosai Canvas Rectangle Icon"
          class="logo-layer logo-rectangle"
        />
      </div>

    </div>
  </div>
</section>
