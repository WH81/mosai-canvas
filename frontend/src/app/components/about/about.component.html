<section class="l-section" aria-labelledby="about-title">
  <div class="container">
    <div class="about-content">

      <!-- ── Left Column: Text ─────────────────────────────────────── -->
      <div class="about-text-wrapper">

        <!-- BAND PAGE -->
        <ng-container *ngIf="band; else homeAbout">

          <!-- Band About title -->
          <h2
            id="about-title"
            class="section-title"
            appScrollAnimate
            animationType="fade-slide"
          >
            About
          </h2>

          <!-- Band bio/body -->
          <p
            class="about-body"
            appScrollAnimate
            animationType="fade-slide"
            animationDelay="0.1s"
          >
            {{ band.bio }}
          </p>

        </ng-container>

        <!-- HOME PAGE -->
        <ng-template #homeAbout>

          <div *ngIf="loading" class="loading">
            Loading...
          </div>

          <div *ngFor="let about of aboutList; let i = index">

            <!-- About title -->
            <h2
              id="about-title"
              class="section-title"
              appScrollAnimate
              animationType="fade-slide"
              [animationDelay]="i * 0.15 + 's'"
            >
              {{ about.title }}
            </h2>

            <!-- About body -->
            <p
              class="about-body"
              appScrollAnimate
              animationType="fade-slide"
              [animationDelay]="(i * 0.15 + 0.1) + 's'"
            >
              {{ about.body }}
            </p>

          </div>

        </ng-template>
      </div>

      <!-- ── Right Column: Player / Watermark ─────────────────────── -->

      <!-- BAND PAGE: Spotify player -->
      <div
        *ngIf="showStreamingPlayer"
        class="about-visual-accent about-player"
        aria-label="Music player"
      >
        <app-streaming-players
          [streamingPlayer]="streamingPlayer"
        ></app-streaming-players>
      </div>

      <!-- HOME PAGE / No player: watermark -->
      <div
        *ngIf="showWatermark"
        class="about-visual-accent"
        aria-hidden="true"
      >
        <span #parallaxText class="vertical-brand">
          {{ band ? band.name : 'MOSAI CANVAS' }}
        </span>
      </div>

    </div>
  </div>
</section>
